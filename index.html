<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4A90E2">
  <meta name="description" content="AI News Analyzer — анализ и краткая сводка новостей">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./assets/icon-192.svg">
  <link rel="stylesheet" href="./css/styles.css">
  <title>AI News Analyzer</title>
</head>
<body>
  <div id="app">
    <header class="app-header card">
      <h1>AI News Analyzer</h1>
      <div class="header-actions">
        <button id="openSettingsBtn" class="ghost">☰ Меню</button>
        <button id="analyzeNewsBtn">Анализ новостей</button>
      </div>
    </header>

    <section id="offlineBanner" class="offline-banner hidden">
      Вы оффлайн. Показаны сохранённые данные
    </section>

    <section id="apiScreen" class="card screen hidden">
      <h2>API ключ</h2>
      <label for="providerSelect">Провайдер ИИ</label>
      <select id="providerSelect">
        <option value="openai">OpenAI</option>
        <option value="deepseek">DeepSeek</option>
        <option value="groq">Groq</option>
        <option value="huggingface">Hugging Face</option>
      </select>
      <label for="apiKeyInput">Введите API ключ</label>
      <input id="apiKeyInput" type="password" autocomplete="off" placeholder="sk-... / gsk_...">
      <p class="warning">Ключ хранится локально и не защищён.</p>
      <button id="saveApiBtn">Сохранить</button>
    </section>

    <main id="mainScreen" class="hidden">
      <section class="card">
        <h2>Мини-сводка</h2>
        <p id="updatedAt" class="muted">Обновлено: никогда</p>
        <div id="summaryContent" class="content"></div>
      </section>

      <section class="card">
        <h2>Поиск по теме</h2>
        <div class="inline-form">
          <input id="topicInput" type="text" placeholder="Например: искусственный интеллект">
          <button id="analyzeTopicBtn">Анализ</button>
        </div>
      </section>

      <section class="card">
        <h2>Сохранённые темы</h2>
        <div id="savedTopicsList" class="topics-list"></div>
      </section>
    </main>

    <section id="topicScreen" class="card screen hidden">
      <button id="backToMainBtn" class="ghost">← Назад</button>
      <h2 id="topicTitle">Анализ темы</h2>
      <div id="topicAnalysis" class="content"></div>
    </section>

    <section id="settingsScreen" class="card screen hidden">
      <h2>Настройки</h2>
      <label for="themeSelect">Тема</label>
      <select id="themeSelect">
        <option value="light">Светлая</option>
        <option value="dark">Тёмная</option>
      </select>
      <label for="limitSelect">Лимит новостей</label>
      <select id="limitSelect">
        <option value="5">5</option>
        <option value="10">10</option>
        <option value="20">20</option>
      </select>
      <label class="toggle-row">
        <span>Автообновление</span>
        <input id="autoRefreshToggle" type="checkbox">
      </label>
      <button id="closeSettingsBtn" class="ghost">Закрыть</button>
    </section>

    <div id="loader" class="loader hidden">Загрузка...</div>
    <div id="toast" class="toast hidden"></div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
